name: build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - ci/release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: dependencies
      run: sudo apt install -y ninja-build

    - name: clone llvm
      uses: actions/checkout@main
      with:
        repository: llvm/llvm-project
        path: llvm

    - name: clone alessastruct
      uses: actions/checkout@main
      with:
        repository: dreamingmoths/alessastruct
        path: llvm/clang-tools-extra/alessastruct

    - name: add alessastruct to cmakelists.txt
      working-directory: llvm/clang-tools-extra
      run: echo "add_subdirectory(alessastruct)" >> CMakeLists.txt

    - name: run ccache action
      uses: hendrikmuhs/ccache-action@v1.2.25
      
    - name: run cmake
      working-directory: llvm
      run: |
       mkdir build && cd build; \
       cmake -G Ninja ../llvm -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
       -DLLVM_TARGETS_TO_BUILD=X86 -DCMAKE_BUILD_TYPE=Release \
       -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
       
    - name: build alessastruct
      working-directory: llvm/build
      run: ninja alessastruct

    - name: upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: alessastruct
        path: llvm/build/bin/alessastruct

    - name: release artifact
      uses: softprops/action-gh-release@v3.0.4
      with:
        files: llvm/build/bin/alessastruct
        draft: true
        generate_release_notes: true
