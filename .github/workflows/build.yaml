name: build

on:
  workflow_dispatch:
  push:
    tags:
      - '*'
    branches:
      - ci/release
      - ci/macOS

jobs:
  build:
    runs-on: ${{ matrix.TARGET.OS }}
    strategy:
      fail-fast: false
      matrix:
        TARGET:
          - {
              OS: 'ubuntu-latest',
              ARTIFACT_NAME: 'alessastruct-linux-x86_64'
            }
          - {
              OS: 'macos-latest',
              ARTIFACT_NAME: 'alessastruct-macos-arm64'
            }

    steps:
    - name: install dependencies (ubuntu)
      if: matrix.TARGET.OS == 'ubuntu-latest'
      run: sudo apt install -y ninja-build

    - name: install dependencies (macOS)
      if: matrix.TARGET.OS == 'macos-latest'
      run: brew install ninja

    - name: clone llvm
      uses: actions/checkout@main
      with:
        repository: llvm/llvm-project
        path: llvm

    - name: clone alessastruct
      uses: actions/checkout@main
      with:
        repository: dreamingmoths/alessastruct
        path: llvm/clang-tools-extra/alessastruct

    - name: add alessastruct to cmakelists.txt
      working-directory: llvm/clang-tools-extra
      run: echo "add_subdirectory(alessastruct)" >> CMakeLists.txt

    - name: run ccache action
      uses: hendrikmuhs/ccache-action@v1.2.25
      
    - name: run cmake
      working-directory: llvm
      run: |
       mkdir build && cd build; \
       cmake -G Ninja ../llvm -DLLVM_ENABLE_PROJECTS="clang;clang-tools-extra" \
       -DLLVM_TARGETS_TO_BUILD=X86 -DCMAKE_BUILD_TYPE=Release \
       -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
       
    - name: build alessastruct
      working-directory: llvm/build
      run: ninja alessastruct

    - name: upload artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        name: ${{ matrix.TARGET.ARTIFACT_NAME }}
        path: llvm/build/bin/alessastruct

    - name: rename artifact
      run: mv llvm/build/bin/alessastruct llvm/build/bin/${{ matrix.TARGET.ARTIFACT_NAME }}

    - name: release artifact
      uses: softprops/action-gh-release@v3.0.4
      if: github.ref_type == 'tag'
      with:
        files: llvm/build/bin/${{ matrix.TARGET.ARTIFACT_NAME }}
        draft: true

